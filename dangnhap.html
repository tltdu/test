                    <table>
                        <tr>
                            <td colspan="2">
                                <img src="images/dangnhap/userlogin.png" id="imglog">

                            <td><label for="email"></label><i class="fa fa-envelope icon"></i></td>

                        </tr>
                        <tr>
                            <td><label for="psw"></label><i class="fa fa-key icon"></i></td>
                            <td>
                                <input type="text" id="psw" placeholder="Nhập mật khẩu"> 
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2">
                                <input type="submit" value="Đăng nhập ">

                        </tr>
                        <tr>
                            <td colspan="2" class="lv">
                                Bạn quên

                        </tr>
                    </table>
