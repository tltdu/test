        <div class="h1"></div>

    <main>
        <article>
            <h1>Liên hệ</h1>
            <img src="images/lienhe/check-in.png">
            <h1>Địa chỉ: 0123, Tòa Nhà ABC, TP. Cần Thơ</h1>
            <p>Nếu bạn có góp ý, vui lòng liên hệ bằng thư điện tử hoặc sử dụng biểu mẫu bên dưới. Xin cám ơn.</p>
            <form method="post" enctype="application/x-www-form-urlencoded">
                <fieldset>
                    <legend>Góp ý</legend>
                    <table>
                        <tr>
                            <td><label for="name"></label>Họ Tên:</td>
                            <td>
                                <input type="text" size="23" id="name" placeholder="Vui lòng nhập Họ tên của bạn">  
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <label for="email">Email:</label>
                            </td>
                            <td>
                                <input type="text" size="23"  id="email" placeholder="Vui lòng nhập địa chỉ Email">  
                            </td>
                        </tr>
                        <tr>
                            <td>Chủ đề:	</td>
                            <td>
                                <select size="1"> 
                                    <option>Về Sản Phẩm/ Dịch Vụ</option>
                                    <option>Về Ưu Đãi Thành Viên</option>
                                    <option>Về Tin Tuyển Dụng</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2">
                                Nội dung:
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2">
                                <textarea rows="7" cols="50" placeholder="Nội dung cần liên hệ"></textarea>
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2" align="center">
                                <input type="submit" value="Gửi">
                            </td>
                        </tr>
                    </table>
                </fieldset>
            </form>
        </article>
    </main>
